name: R8 Test APK

on:
  push:
    branches:
      - r8-test

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # A release build (not debuggable, so ART fully optimises it and the
      # Compose baseline profiles apply), signed with the same key as before.
      - name: Restore signing key
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/jellio-tv.keystore"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/jellio-tv.keystore" >> "$GITHUB_ENV"
          fi
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease
        env:
          # Same version code as the installed 0.55.6 (Publish APK run 171), so it
          # installs over it, and the next real release still upgrades it.
          VERSION_CODE: "171"
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jellio-tv-r8-test
          path: app/build/outputs/apk/release/app-release.apk

      # Also kept on the branch itself so it has a direct download link.
      - name: Commit APK to the branch
        run: |
          git config user.name "Noah S. Kipp"
          git config user.email "NoahSKipp@users.noreply.github.com"
          git pull --rebase origin r8-test
          mkdir -p test-apk
          cp app/build/outputs/apk/release/app-release.apk test-apk/jellio-tv-r8-test.apk
          git add test-apk/jellio-tv-r8-test.apk
          git commit -m "chore: add R8 test APK"
          git push
