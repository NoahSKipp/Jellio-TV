name: Publish APK

on:
  release:
    types:
      - released
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Debug-signed until a real release keystore exists (no signing
      # secrets configured yet): still a real, directly installable
      # sideload APK, same real build type Nuvio's own README points
      # people at for building from source.
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: Rename and checksum APK
        run: |
          mkdir -p dist
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then TAG=$(gh release view --json tagName -q .tagName); fi
          cp app/build/outputs/apk/debug/app-debug.apk "dist/jellio-tv-${TAG}.apk"
          cd dist
          for file in ./*; do
            md5sum "${file#./}" >> "${file%.*}.md5"
            sha256sum "${file#./}" >> "${file%.*}.sha256"
          done
          ls -l
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Upload GitHub release assets (release)
        if: github.event_name == 'release'
        uses: shogo82148/actions-upload-release-asset@v1.9.0
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./dist/*

      - name: Upload GitHub release assets (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: gh release upload "$(gh release view --json tagName -q .tagName)" ./dist/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
