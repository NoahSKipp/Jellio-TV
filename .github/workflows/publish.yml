name: Publish APK

on:
  release:
    types:
      - released
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish assets to (e.g. 0.54.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # A release build (not debuggable, so ART fully optimises it and the
      # Compose baseline profiles apply), signed with the same key as before.
      - name: Restore signing key
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/jellio-tv.keystore"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/jellio-tv.keystore" >> "$GITHUB_ENV"
          fi
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Rename and checksum APK
        run: |
          mkdir -p dist
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          if [ -z "$TAG" ]; then
            echo "Error: No release tag provided. Refusing to clobber existing releases."
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk "dist/jellio-tv-${TAG}.apk"
          cd dist
          for file in ./*; do
            md5sum "${file#./}" >> "${file%.*}.md5"
            sha256sum "${file#./}" >> "${file%.*}.sha256"
          done
          ls -l
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Upload GitHub release assets (release)
        if: github.event_name == 'release'
        uses: shogo82148/actions-upload-release-asset@v1.9.0
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./dist/*

      - name: Upload GitHub release assets (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            echo "Error: No release tag provided for manual upload."
            exit 1
          fi
          gh release upload "$TAG" ./dist/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
