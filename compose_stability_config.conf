// Classes the Compose compiler may treat as stable: they only hold read-only
// values and are replaced, never changed in place. Lets rows and cards skip
// recomposing when their data hasn't changed. Only add a class here if that
// holds for it.

// Server data (BaseItemDto and friends) and the cached row snapshots
com.jellio.tv.data.model.*
com.jellio.tv.data.cache.*

// Home and player state handed to composables
com.jellio.tv.ui.home.HomeSection
com.jellio.tv.ui.home.HomeRow
com.jellio.tv.ui.home.PosterHomeRow
com.jellio.tv.ui.home.ComingSoonHomeRow
com.jellio.tv.ui.home.StudioHubsHomeRow
com.jellio.tv.ui.home.ShowcaseInfo
com.jellio.tv.ui.player.PauseOverlayInfo
com.jellio.tv.ui.player.UpNextInfo
com.jellio.tv.ui.player.SubtitleTrackUiState
com.jellio.tv.ui.player.AudioTrackUiState

// Read-only Kotlin collections, as the app never changes them after building
kotlin.collections.List
kotlin.collections.Map
kotlin.collections.Set
